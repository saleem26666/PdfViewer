name: pdf_viewer
description: Personal ebook reader — PDF, EPUB, Kindle, FB2, text, and comics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pdfrx: ^2.2.0
  file_picker: ^8.1.2
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  archive: ^4.0.0
  html: ^0.15.5
  xml: ^6.5.0
  pdf: ^3.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#B71C1C"
  adaptive_icon_foreground: assets/icon/app_icon_fg.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoNaskhArabic-Regular.ttf
  fonts:
    - family: Nastaliq
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
